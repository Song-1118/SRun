name: Bug 报告
description: 提交一个 Bug 帮助我们改进
title: "BUG"
labels: ["BUG", "新提交"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你花时间填写这份 Bug 报告！提交前请确认信息真实完整。
  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜索过现有的 Issues，确认这不是重复提交
          required: true
  - type: textarea
    id: description
    attributes:
      label: 描述 Bug
      description: 简要描述这个BUG。
      placeholder: 这个BUG是什么？
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 告诉我们如何复现这个BUG。
      placeholder: 复现这个BUG的步骤。
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: 例如 Windows 10 / macOS 14 / Ubuntu 22.04
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 软件版本
      placeholder: 例如 v1.0.0
    validations:
      required: true
  - type: markdown
    attributes:
      value: >
        << **版本号提示**：你可以在软件设置 → 关于中找到当前版本号。
  - type: textarea
    id: logs
    attributes:
      label: 附件
      description: 产生BUG时的日志或截图（可直接拖拽图片到此处上传）
      render: shell
    validations:
      required: false
