name: Bug 报告
description: 提交一个 Bug 帮助我们改进
title: "[Bug] "
labels: ["BUG","新提交"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你花时间填写这份 Bug 报告！提交前请确认信息真实完整。
  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜索过现有的 Issues，确认这不是重复提交
          required: true
        - label: 我已阅读并同意贡献者公约
          required: true
  - type: textarea
    id: description
    attributes:
      label: 描述 Bug
      description: 清晰简洁地描述这个 Bug 是什么。
      placeholder: 告诉我们发生了什么
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 一步步告诉我们如何复现这个 Bug
      placeholder: |
        1. 前往 '...'
        2. 点击 '....'
        3. 看到错误
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 你原本期望发生什么？
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么？（如果有错误信息请贴在这里）
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: 严重程度
      options:
        - 严重
        - 高
        - 中
        - 低
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: 例如 Windows 10 / macOS 14 / Ubuntu 22.04
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 软件版本
      placeholder: 例如 v1.0.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志/截图
      description: 如果可以，请附上日志或截图（可直接拖拽图片到此处上传）
      render: shell
    validations:
      required: false