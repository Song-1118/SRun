name: 功能请求
description: 提交一个功能建议帮助我们改进
title:
  placeholder: "FEATURE"
labels: ["FEATURE", "新提交"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你花时间填写这份功能请求！提交前请确认信息真实完整。
  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜索过现有的 Issues，确认这不是重复提交
          required: true
  - type: textarea
    id: description
    attributes:
      label: 描述功能
      description: 简要描述你希望添加的功能。
      placeholder: 这个功能是什么？
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: 使用场景
      description: 描述这个功能的使用场景和价值。
      placeholder: 这个功能在什么情况下会用到？它能解决什么问题？
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 目标平台
      placeholder: 例如 Windows / macOS / Linux / 全部
    validations:
      required: true
  - type: textarea
    id: implementation
    attributes:
      label: 实现建议（可选）
      description: 如果你有实现思路，可以在这里描述。
      placeholder: 你认为这个功能应该如何实现？
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: 附件
      description: 相关截图或其他信息（可直接拖拽图片到此处上传）
      render: shell
    validations:
      required: false
